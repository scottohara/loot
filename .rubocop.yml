---
inherit_gem:
  rubocop-config-oharagroup:
    - default.yml
    - factory_bot.yml
    - performance.yml
    - rails.yml
    - rake.yml
    - rspec_rails.yml
    - rspec.yml

# Can't use :inverse_of due to self-referential and polymorphic associations
Rails/InverseOf:
  Enabled: false

# Needed for update_all for bulk updating transaction statuses during reconciliation
Rails/SkipsModelValidations:
  Enabled: false

# Switching to strong parameters is a roadmap item (remove when we do)
Rails/StrongParametersExpect:
  Enabled: false
