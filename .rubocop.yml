---
plugins:
  - rubocop-factory_bot
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails

inherit_gem:
  rubocop-config-oharagroup:
    - default.yml
    - factory_bot.yml
    - performance.yml
    - rails.yml
    - rake.yml
    - rspec_rails.yml
    - rspec.yml

AllCops:
  Exclude:
    - "bin/*"
    - "config/**/*"
    - "db/migrate/*"
    - "db/schema.rb"
    - "node_modules/**/*"
    - "spec/*_helper.rb"
    - "vendor/**/*"

# Can't fully qualify a private_constant
Lint/ConstantResolution:
  Ignore:
    - CONTEXTS
    - FREQUENCIES
    - MAX_TRANSACTION_DATE
    - NUM_RESULTS
    - Period
    - SHOW_FIELDS
    - EDIT_FIELDS
    - TRANSACTION_TYPES

# Allow reading of ENV vars for authentication
Rails/EnvironmentVariableAccess:
  AllowReads: true

# Can't use :inverse_of due to self-referential and polymorphic associations
Rails/InverseOf:
  Enabled: false

# Needed for update_all for bulk updating transaction statuses during reconciliation
Rails/SkipsModelValidations:
  Enabled: false
